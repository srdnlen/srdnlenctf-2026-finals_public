services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      - proxy
    network_mode: service:proxy

  bot:
    build: bot
    restart: unless-stopped
    depends_on:
      - proxy
      - app
    network_mode: service:proxy
    environment:
      APPNAME: Bot
      APPURL: http://app:3000/
      APPURLREGEX: ^https?://.*$
      FLAG: "srdnlen{vn0de_1nj3ct1on_are_4_th1ng_uh}"
      APPLIMIT: 2
      APPLIMITTIME: 10
      USE_PROXY: 1
