services:
  badge:
    build: .
    image: ghcr.io/srdnlen/srdnlenctf-2026/images/entry_pass:latest
    expose:
      - "8000"
    labels:
      klodd.expose: "true"
      klodd.kind: "http"
      klodd.port: "8000"
      klodd.timeout: "900000"
    environment:
      - FLAG=srdnlen{V1p_4cC3sS_Gr4nT3d_bY_4_pDf_Th4T_R34d_1tS_0wN_s3Cr3TS!?_e92f7d592d59a39b}
    tmpfs:
      - /opt/service/scratch:mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    mem_limit: 1536m
    cpus: "1.5"
